<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cadastro TIC Trens — Trecho 3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .titulo{position:absolute;z-index:1000;top:10px;left:10px;background:#281872;color:#fff;
          padding:8px 14px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .titulo b{font-size:15px}.titulo small{opacity:.85}
  .leaflet-popup-content{font-size:13px}
  .leaflet-popup-content b{color:#281872}
  .lbl{background:transparent;border:none;box-shadow:none;color:#fff;font-size:11px;font-weight:bold;
       text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000;padding:0;margin-left:3px}
  .lbl:before{display:none}
</style>
</head>
<body>
<div class="titulo"><b>Cadastro de Imóveis — TIC Trens · Trecho 3</b><br><small>Levantamento cadastral</small></div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map=L.map('map');
// satélite híbrido: imagery + overlay de labels/limites (semelhante ao Google Satellite Hybrid)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:20, attribution:'Esri World Imagery'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:20, opacity:0.9}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:20, opacity:0.9}).addTo(map);

// símbolo igual ao QGIS: losango roxo com contorno
const FILL='rgb(152,125,183)', STROKE='rgb(109,89,131)';
function diamante(){
  const svg='<svg width="14" height="14" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">'+
    '<rect x="3.2" y="3.2" width="7.6" height="7.6" transform="rotate(45 7 7)" '+
    'fill="'+FILL+'" stroke="'+STROKE+'" stroke-width="1.2"/></svg>';
  return L.divIcon({html:svg,className:'',iconSize:[14,14],iconAnchor:[7,7]});
}
const rot=(k,v)=>v==null||v===''?'':`<b>${k}:</b> ${v}<br>`;
fetch('dados.geojson').then(r=>r.json()).then(gj=>{
  const layer=L.geoJSON(gj,{
    pointToLayer:(f,ll)=>L.marker(ll,{icon:diamante()}),
    onEachFeature:(f,l)=>{const p=f.properties;
      if(p.codigo) l.bindTooltip(String(p.codigo),{permanent:true,direction:'right',className:'lbl',offset:[6,0]});
      l.bindPopup(`<b>${p.codigo||'—'}</b><br>`+
        rot('Município',p.municipio)+rot('Tipo',p.tipo_imovel)+
        rot('Classificação',p.classificacao_padrao)+rot('Status',p.status)+
        rot('Tipo edificação',p.tipo_edificacao)+rot('Nº cômodos',p.num_comodos)+
        rot('Banheiros',p.num_banheiros)+rot('Área (m²)',p.constr_area)+
        rot('Prioridade',p.prioridade_demo));}
  }).addTo(map);
  map.fitBounds(layer.getBounds(),{padding:[40,40]});
}).catch(e=>{document.querySelector('.titulo').innerHTML+='<br><small style=color:#ffb0b0>Erro ao carregar dados.geojson</small>';});
</script>
</body>
</html>
