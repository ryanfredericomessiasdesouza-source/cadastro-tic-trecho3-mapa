<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cadastro TIC Trens — Trecho 3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .titulo{position:absolute;z-index:1000;top:10px;left:10px;background:#281872;color:#fff;
          padding:8px 14px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .titulo b{font-size:15px}.titulo small{opacity:.8}
  .leaflet-popup-content{font-size:13px}
  .leaflet-popup-content b{color:#281872}
  .legenda{position:absolute;z-index:1000;bottom:16px;left:10px;background:#fff;padding:8px 10px;
           border-radius:6px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid #333;vertical-align:middle}
</style>
</head>
<body>
<div class="titulo"><b>Cadastro de Imóveis — TIC Trens · Trecho 3</b><br><small>Levantamento cadastral (dados técnicos)</small></div>
<div id="map"></div>
<div class="legenda"><b>Status</b><br>
  <span class="dot" style="background:#e74c3c"></span>Não iniciado<br>
  <span class="dot" style="background:#f1c40f"></span>Em andamento<br>
  <span class="dot" style="background:#2ecc71"></span>Concluído
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map=L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:20, attribution:'Esri World Imagery'}).addTo(map);
const cor=s=>({'Concluído':'#2ecc71','Em andamento':'#f1c40f'}[s]||'#e74c3c');
const rot=(k,v)=>v==null||v===''?'':`<b>${k}:</b> ${v}<br>`;
fetch('dados.geojson').then(r=>r.json()).then(gj=>{
  const layer=L.geoJSON(gj,{
    pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,color:'#222',weight:1,
      fillColor:cor(f.properties.status),fillOpacity:.9}),
    onEachFeature:(f,l)=>{const p=f.properties;
      l.bindPopup(`<b>${p.codigo||'—'}</b><br>`+
        rot('Município',p.municipio)+rot('Tipo',p.tipo_imovel)+
        rot('Classificação',p.classificacao_padrao)+rot('Status',p.status)+
        rot('Tipo edificação',p.tipo_edificacao)+rot('Nº cômodos',p.num_comodos)+
        rot('Banheiros',p.num_banheiros)+rot('Área (m²)',p.constr_area)+
        rot('Prioridade',p.prioridade_demo));}
  }).addTo(map);
  map.fitBounds(layer.getBounds(),{padding:[30,30]});
}).catch(e=>{document.querySelector('.titulo').innerHTML+='<br><small style=color:#ffb0b0>Erro ao carregar dados.geojson</small>';});
</script>
</body>
</html>
