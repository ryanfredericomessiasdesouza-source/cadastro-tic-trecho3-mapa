<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cadastro TIC Trens — Trecho 3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .titulo{position:absolute;z-index:1000;top:10px;left:10px;background:#281872;color:#fff;
          padding:8px 12px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3);
          display:flex;align-items:center;gap:10px}
  .titulo img{height:34px;background:#fff;border-radius:4px;padding:2px}
  .titulo b{font-size:15px}.titulo small{opacity:.85}
  .filtro{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:8px 10px;
          border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.3);font-size:12px}
  .filtro b{color:#281872;font-size:12px}
  .filtro label{display:block;margin-top:4px;cursor:pointer}
  .filtro .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid #333;vertical-align:middle}
  .filtro .cnt{color:#777}
  .lbl{background:transparent;border:none;box-shadow:none;color:#fff;font-size:11px;font-weight:bold;
       text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000;padding:0;margin-left:3px}
  .lbl:before{display:none}
  .leaflet-popup-content{margin:8px 10px;width:280px!important}
  .fc h4{margin:0;background:#281872;color:#fff;font-size:12px;padding:3px 6px;border-radius:3px}
  .fc .sec{color:#281872;font-weight:bold;font-size:11px;margin:7px 0 2px;border-bottom:1px solid #FF7021}
  .fc table{width:100%;border-collapse:collapse;font-size:11px}
  .fc td{padding:1px 3px;vertical-align:top}
  .fc td.k{color:#555;width:46%}
  .fc .body{max-height:300px;overflow:auto}
</style>
</head>
<body>
<div class="titulo"><img src="logo_tic_trens.png" alt="TIC Trens"><div><b>Cadastro de Imóveis — Trecho 3</b><br><small>Levantamento cadastral</small></div></div>
<div class="filtro" id="filtro"><b>Status</b></div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map=L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri World Imagery'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,opacity:.9}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,opacity:.9}).addTo(map);

const FILL='rgb(152,125,183)',STROKE='rgb(109,89,131)';
const diamante=()=>L.divIcon({className:'',iconSize:[14,14],iconAnchor:[7,7],
  html:'<svg width="14" height="14" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><rect x="3.2" y="3.2" width="7.6" height="7.6" transform="rotate(45 7 7)" fill="'+FILL+'" stroke="'+STROKE+'" stroke-width="1.2"/></svg>'});

// definicao do formulario (secoes -> [campo,rotulo])
const MEL=[["mel_calcada","Calçada"],["mel_iluminacao","Iluminação Pública"],["mel_coleta_lixo","Coleta de Lixo"],["mel_internet","Internet"],["mel_esgoto","Esgoto"],["mel_luz","Luz Domiciliar"],["mel_fossa","Fossa"],["mel_pavimentacao","Pavimentação"],["mel_gas","Gás"],["mel_telefone","Telefone"]];
const SECOES=[
 ["1. Ocupante",[["nome","Nome"],["municipio","Município"],["bairro","Bairro"],["endereco","Endereço"]]],
 ["2. Características da Região",[["infraestrutura_local","Infraestrutura"],["padrao_ocupacao","Padrão de ocupação"],["vias_acesso","Vias de acesso"],["localizacao_lote","Localização"],["greide","Greide"],["topografia","Topografia"],["aproveitamento_uso","Aproveitamento/Uso"],["obs_regiao","Observação"]]],
 ["3. Habitação e Serviços",[["tamanho_edificacao","Tamanho"],["tempo_residencia","Tempo de residência"],["material_paredes","Paredes"],["material_cobertura","Cobertura"],["material_piso","Piso"],["agua_canalizada","Água canalizada"],["agua_proveniente","Água proveniente"],["escoadouro","Escoadouro"],["mais_uma_familia","+1 família?"],["num_pavimentos","Pavimentos"],["pavimentos_ocupante","Pav. do ocupante"],["num_comodos","Nº cômodos"],["comodos_dormitorio","Dormitórios"],["num_banheiros","Banheiros"]]],
 ["4. Construção e Demolição",[["constr_descricao","Descrição"],["constr_idade","Idade"],["constr_estado","Estado conserv."],["constr_perimetro","Perímetro (m)"],["constr_area","Área (m²)"],["tipo_edificacao","Tipo edificação"],["faixa_dominio","Faixa de domínio"],["em_desnivel","Desnível"],["prioridade_demo","Prioridade"],["risco_impacto","Risco impacto"]]],
 ["Classificação",[["tipo_imovel","Tipo imóvel"],["classificacao_padrao","Padrão (A–H)"],["status","Status"]]],
];
const val=v=>v==null||v===''?'—':v;
function linhas(p,campos){
  return campos.map(([k,l])=>`<tr><td class="k">${l}</td><td>${val(p[k])}</td></tr>`).join('');
}
function popupHTML(p){
  const mel=MEL.filter(([k])=>p[k]==1||p[k]===true||p[k]==='1').map(([,l])=>l).join(', ')||'—';
  let h=`<div class="fc"><h4>${p.codigo||'—'}</h4><div class="body">`;
  for(const [nome,campos] of SECOES){
    h+=`<div class="sec">${nome}</div><table>${linhas(p,campos)}`;
    if(nome.startsWith('2.')) h+=`<tr><td class="k">Melhoramentos</td><td>${mel}</td></tr>`;
    h+=`</table>`;
  }
  return h+`</div></div>`;
}
const grupo=L.layerGroup().addTo(map);
const marcadores=[]; const ativos=new Set();
function render(){
  grupo.clearLayers();
  marcadores.forEach(m=>{ if(ativos.has(m.status)) grupo.addLayer(m.mk); });
}
fetch('dados.geojson').then(r=>r.json()).then(gj=>{
  const bounds=[]; const cont={};
  gj.features.forEach(f=>{
    const p=f.properties, c=f.geometry&&f.geometry.coordinates; if(!c) return;
    const ll=[c[1],c[0]]; bounds.push(ll);
    const st=p.status||'Não iniciado'; cont[st]=(cont[st]||0)+1;
    const mk=L.marker(ll,{icon:diamante()});
    if(p.codigo) mk.bindTooltip(String(p.codigo),{permanent:true,direction:'right',className:'lbl',offset:[6,0]});
    mk.bindPopup(popupHTML(p),{maxWidth:300});
    marcadores.push({mk,status:st});
  });
  // monta filtro
  const fdiv=document.getElementById('filtro');
  Object.keys(cont).sort().forEach(st=>{
    ativos.add(st);
    const id='f_'+st.replace(/\W/g,'');
    fdiv.insertAdjacentHTML('beforeend',
      `<label><input type="checkbox" id="${id}" checked> ${st} <span class="cnt">(${cont[st]})</span></label>`);
    setTimeout(()=>document.getElementById(id).addEventListener('change',e=>{
      e.target.checked?ativos.add(st):ativos.delete(st); render();
    }),0);
  });
  render();
  if(bounds.length) map.fitBounds(bounds,{padding:[40,40]});
}).catch(e=>{document.querySelector('.titulo').innerHTML+='<br><small style=color:#ffb0b0>Erro ao carregar dados</small>';});
</script>
</body>
</html>
